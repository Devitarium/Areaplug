<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Add your buisness</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/form.css'>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/common.js"></script>
  <script src='js/form.js' defer></script>
</head>
<body>
    <!-- add-business.html -->
<form id="businessForm" class="add-business-form">
  <h2>Add Your Business</h2>

  <label for="name">Business Name</label>
  <input type="text" id="name" name="name" required>

  <label for="image">Business Image</label>
  <input type="file" id="image" name="image" accept="image/*" required>

  <label for="category">Category</label>
  <select id="category" name="category" required>
    <option value="">Select Category</option>
    <option value="food">Food</option>
    <option value="fashion">Fashion</option>
    <option value="tech">Tech</option>
    <option value="service">Service</option>
    <!-- Add more if needed -->
  </select>

  <label for="description">Description</label>
  <textarea id="description" name="description" rows="3" required></textarea>

<label for="business_link">Business Link</label>
<input type="url" id="business_link" name="business_link" placeholder="https://example.com" required>


<select name="location" id="location">
  <option value="">-- Select Location --</option>
  <option value="School Junction">School Junction</option>
  <option value="School Road">School Road</option>
  <option value="Falex Road">Falex Road</option>
  <option value="SY8">SY8</option>
  <option value="ICT">ICT</option>
  <option value="Irare">Irare</option>
  <option value="Oye Market">Oye Market</option>
  <option value="Estate">Estate</option>
  <option value="Other">Other</option>
</select>

<div id="other-location-container" style="display: none; margin-top: 1rem;">
  <label for="other-location">Please specify:</label>
  <input type="text" id="other-location" name="other_location" placeholder="Enter location" />
</div>

  <label>Delivery Available?</label>
  <label><input type="radio" name="delivery" value="Yes" required> Yes</label>
  <label><input type="radio" name="delivery" value="No" required> No</label>

  <label for="tier">Choose a Plan</label>
  <select id="tier" name="tier" required>
    <option value="">Select Tier</option>
    <option value="standard">Standard (Free Trial)</option>
    <option value="silver">Silver</option>
    <option value="gold">Gold</option>
    <option value="platinum">Platinum</option>
  </select>

  <label for="duration">Subscription Duration</label>
  <select id="duration" name="duration" required>
    <option value="">Select Duration</option>
    <option value="monthly">Monthly</option>
    <option value="yearly">Yearly</option>
  </select>
  <label for="school">School</label>
<select id="school" name="school" onchange="handleSchoolChange()" required>
  <option value="">-- Select School --</option>
  <option value="FUOYE">Federal University Oye Ekiti (FUOYE)</option>
  <option value="EKSU">Ekiti State University (EKSU)</option>
  <!-- Add more -->
</select>

<div id="campus-container" style="margin-top: 1rem;">
  <label for="campus">Campus</label>
  <select id="campus" name="campus" required>
    <option value="">-- Select Campus --</option>
    <!-- This will be dynamically filled based on school -->
  </select>
</div>


  <button type="submit">Submit Business</button>
</form>

</body>
</html>
