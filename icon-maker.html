<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AreaPlug icon maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --plug-yellow: #facc15;
      --area-black: #111111;
      --bg: #FFFFFF;
      --stroke: 0.025em; /* 0.8px at 32px, scaled so it looks identical at any size */
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #d9d9d9;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      align-items: flex-start;
      font-family: sans-serif;
    }
    .label { font-size: 14px; color: #333; margin-bottom: 8px; }

    .brand { font-family: sans-serif; font-weight: 700; line-height: 1; }
    .area, .plug {
      font-weight: 700;
      -webkit-text-stroke: var(--stroke) currentColor;
    }
    .area { color: var(--area-black); margin-right: 0.0625em; } /* your 2px gap at 32px */
    .plug { color: var(--plug-yellow); }

    /* A: favicon icon, 512 x 512 (square, no rounded corners) */
    #icon-ap {
      width: 512px; height: 512px;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    #icon-ap .brand { font-size: 250px; }

    /* B: stacked wordmark, 512 x 512 (square, no rounded corners) */
    #icon-stacked {
      width: 512px; height: 512px;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    #icon-stacked .brand { font-size: 150px; }
    #icon-stacked .area { margin-right: 0; }

    /* C: social preview, 1200 x 630 */
    #social {
      width: 1200px; height: 630px;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px;
    }
    #social .brand { font-size: 160px; }
    #social .tagline { font-size: 44px; font-weight: 500; color: #333; }
  </style>
</head>
<body>

  <div>
    <div class="label">A: icon 512 x 512</div>
    <div id="icon-ap"><span class="brand"><span class="area">A</span><span class="plug">P</span></span></div>
  </div>

  <div>
    <div class="label">B: stacked 512 x 512</div>
    <div id="icon-stacked">
      <span class="brand area">Area</span>
      <span class="brand plug">Plug</span>
    </div>
  </div>

  <div>
    <div class="label">C: social preview 1200 x 630</div>
    <div id="social">
      <span class="brand"><span class="area">Area</span><span class="plug">Plug</span></span>
      <span class="tagline">A network of local businesses in your area</span>
    </div>
  </div>

</body>
</html>
