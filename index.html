<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FuoyePlug</title>
  <link rel="stylesheet" href="css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/script.js"></script>
</head>
<button id="back-to-top" title="Go to top">
  <svg xmlns="http://www.w3.org/2000/svg" class="svg" viewBox="0 0 24 24" fill="currentColor">
    <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
  </svg>
</button>
<body>
 
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <span class="area">Fuoye</span><span class="plug">Plug</span>
    </div>
    <div class="action-btn">
      <a href="add-buisness.html" class="add-business-btn">Add Your Business</a>
    </div>
  </nav>
 
  <!-- Filter Bar -->
  <div class="filter-container">
    <!-- Search Bar -->
    <div class="search-container">
      <input type="text" id="business-search" placeholder="Search businesses..." class="search-input">
      <button class="search-button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </button>
    </div>
 
    <!-- Desktop Filters -->
    <div class="desktop-filters">
 
      <!-- Campus -->
      <div class="filter-dropdown">
        <button class="filter-button">
          <span class="filter-label">Campus</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </button>
        <div class="dropdown-content" id="campus-dropdown">
          <div class="dropdown-item" data-value="all">All Campuses</div>
          <div class="dropdown-item" data-value="Main Campus">Main Campus</div>
          <div class="dropdown-item" data-value="Ikole Campus">Ikole Campus</div>
          <div class="dropdown-item" data-value="Ido Campus">Ido Campus</div>
        </div>
      </div>
 
      <!-- General Location -->
      <div class="filter-dropdown">
        <button class="filter-button">
          <span class="filter-label">Location</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </button>
        <div class="dropdown-content" id="location-dropdown">
          <div class="dropdown-item" data-value="all">All Locations</div>
          <div class="dropdown-item" data-value="School Road">School Road</div>
          <div class="dropdown-item" data-value="Falex Road">Falex Road</div>
          <div class="dropdown-item" data-value="Irare">Irare</div>
          <div class="dropdown-item" data-value="Old Education">Old Education</div>
          <div class="dropdown-item" data-value="Estate">Estate</div>
        </div>
      </div>
 
      <!-- Specific Location -->
      <div class="filter-dropdown">
        <button class="filter-button">
          <span class="filter-label" id="specific-location-label">Specific Location</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </button>
        <div class="dropdown-content" id="specific-location-dropdown">
          <div class="dropdown-item" data-value="all">All Areas</div>
          <!-- Populated dynamically based on location selection -->
        </div>
      </div>
 
      <!-- Category -->
      <div class="filter-dropdown">
        <button class="filter-button">
          <span class="filter-label">Category</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </button>
        <div class="dropdown-content" id="category-dropdown">
          <div class="dropdown-item" data-value="all">All Categories</div>
          <div class="dropdown-item" data-value="food">Food</div>
          <div class="dropdown-item" data-value="fashion">Fashion</div>
          <div class="dropdown-item" data-value="tech">Tech</div>
          <div class="dropdown-item" data-value="service">Service</div>
        </div>
      </div>
 
      <!-- Delivery Toggle -->
      <button class="toggle-filter-btn filter-button"  id="delivery-toggle" data-active="false">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M20 8h-3V4H1v13h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm13.5-8.5l1.96 2.5H17V9.5h2.5zM18 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
        </svg>
        Delivery
      </button>
 
      <!-- Store Toggle -->
      <button class="toggle-filter-btn" id="store-toggle" data-active="false">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M21 7l-2-4H5L3 7v2c0 1.1.9 2 2 2v9h14v-9c1.1 0 2-.9 2-2V7zM5 5h14l1 2H4l1-2zm12 14h-3v-5H10v5H7v-8h10v8z"/>
        </svg>
        Physical Store
      </button>
      <button class="reset-filters-btn" id="reset-filters">Reset Filters</button>
 
    </div>
 
    <!-- Mobile Filter Button -->
    <button class="mobile-filter-button" id="mobile-filter-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
      </svg>
      Filters
    </button>
  </div>
 
  <!-- Mobile Filter Modal -->
  <div class="mobile-filter-modal" id="mobile-filter-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Filters</h3>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
 
        <div class="mobile-filter-group">
          <h4>Campus</h4>
          <select class="mobile-filter-select" id="mobile-campus">
            <option value="all">All Campuses</option>
            <option value="Main Campus">Main Campus</option>
            <option value="Ikole Campus">Ikole Campus</option>
            <option value="Ido Campus">Ido Campus</option>
          </select>
        </div>
 
        <div class="mobile-filter-group">
          <h4>Location</h4>
          <select class="mobile-filter-select" id="mobile-location">
            <option value="all">All Locations</option>
            <option value="School Road">School Road</option>
            <option value="Falex Road">Falex Road</option>
            <option value="Irare">Irare</option>
            <option value="Old Education">Old Education</option>
            <option value="Estate">Estate</option>
          </select>
        </div>
 
        <div class="mobile-filter-group">
          <h4>Specific Location</h4>
          <select class="mobile-filter-select" id="mobile-specific-location">
            <option value="all">All Areas</option>
            <!-- Populated dynamically -->
          </select>
        </div>
 
        <div class="mobile-filter-group">
          <h4>Category</h4>
          <select class="mobile-filter-select" id="mobile-category">
            <option value="all">All Categories</option>
            <option value="food">Food</option>
            <option value="fashion">Fashion</option>
            <option value="tech">Tech</option>
            <option value="service">Service</option>
          </select>
        </div>
 
        <div class="mobile-filter-group">
          <h4>Services</h4>
          <div class="mobile-toggle-group">
            <label class="mobile-toggle-label">
              <input type="checkbox" id="mobile-delivery-toggle"> Delivery Available
            </label>
            <label class="mobile-toggle-label">
              <input type="checkbox" id="mobile-store-toggle"> Physical Store
            </label>
          </div>
        </div>
 
        <button class="apply-filters" id="apply-mobile-filters">Apply Filters</button>
      </div>
    </div>
  </div>
 
  <section id="businesses-container" class="businesses-grid grid-container"></section>
 
</body>
</html>
